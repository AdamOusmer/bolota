name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Rewritten for the flat, standalone library (no more apps/, no workspace
# filters). `probe`/`smoke`/the two-browser composition gate went with the
# scripts they exercised, which no longer exist — see the flatten commit.
jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: bun's minifier output size shifts between
      # patch releases and `scripts/size.ts` enforces byte-exact gzip
      # budgets, so a bun bump can fail this job without any source change.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Size budgets
        run: bun run size

  site:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The site depends on the library through `file:../..`, which links the
      # source tree rather than a packed tarball: bun does not run its
      # `prepare` script for a file: dependency, so `dist/` has to exist
      # before the site resolves `@luzir/bolota`'s exports map.
      - name: Build the library the site links to
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: bun install

      - name: Build
        run: bun run build
