name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Rewritten for the flat, standalone library (no more apps/, no workspace
# filters). `probe`/`smoke`/the two-browser composition gate went with the
# scripts they exercised, which no longer exist — see the flatten commit.
jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Size budgets
        run: bun run size

      - name: Build
        run: bun run build

      - name: Pack
        run: npm pack --pack-destination /tmp

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/blobatar-*.tgz
          retention-days: 7
